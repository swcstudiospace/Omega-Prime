# pip and Actions updates are automatic. Cargo's pinned Prime path dependencies
# live in the ignored prime-agent/ checkout, so Cargo Dependabot cannot fetch
# their manifests. rust-parity.yml builds and license-checks both actual graphs;
# Cargo update automation is an explicit open REPO-04 audit gate.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # tweepy 4.17 requires oauthlib<4 (see SECURITY.md). A 4.x bump makes
      # requirements-lock.txt uninstallable. Drop this when tweepy accepts oauthlib>=4.
      - dependency-name: oauthlib
        update-types: ["version-update:semver-major"]
      # tokenizers 0.23 requires huggingface-hub<2. A 2.x bump makes
      # requirements-lock.txt uninstallable. Drop this when tokenizers accepts it.
      - dependency-name: huggingface-hub
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # requirements-lock.txt is verified for Python 3.12, and the Dockerfile is
      # generated by omega_prime/grokbot/deploy.py (BASE_IMAGE), so a hand-merged
      # tag bump would fail the drift test. Move the interpreter by changing the
      # lock, deploy.py and the Dockerfile together.
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  # The redteam sidecar backend is a tracked gitlink (VENDOR.md pin). Watching
  # the gitsubmodule ecosystem opens a PR when upstream purple-team moves, and
  # the redteam-provenance CI job proves the bump before merge.
  - package-ecosystem: gitsubmodule
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
