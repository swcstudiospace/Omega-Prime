name: ci

on:
  push:
  pull_request:

# Shared receipt logic lives in omega_prime/scripts/ci_receipt.py (stdlib only).

# Least privilege: checkout reads content; artifact upload uses the Actions
# runtime credential, so contents read is enough (no actions write claim).
permissions:
  contents: read

# Queue a newer push instead of cancelling the run already in progress.
# A cancelled run stays on the commit, and the ship gate treats any
# CANCELLED check as a failure even after a later run of that commit passes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        id: checkout
      - uses: actions/setup-python@v5
        id: setup_python
        with:
          python-version: ${{ matrix.python-version }}
      - name: read Prime pin
        id: prime_pin
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          pin = json.load(open("omega_prime/contracts/prime-agent.pin.json"))
          print(f"commit={pin['commit']}")
          EOF
      - name: checkout Prime test prerequisite
        id: prime_checkout
        uses: actions/checkout@v7
        with:
          repository: PrimeIntellect-ai/prime-agent
          ref: ${{ steps.prime_pin.outputs.commit }}
          path: prime-agent
      - name: interpreter identity
        id: interpreter_identity
        env:
          REQUESTED_PYTHON: ${{ matrix.python-version }}
          SETUP_PYTHON_VERSION: ${{ steps.setup_python.outputs.python-version }}
          SETUP_PYTHON_PATH: ${{ steps.setup_python.outputs.python-path }}
        run: python3 omega_prime/scripts/ci_receipt.py identity
      - name: pip identity
        id: pip_identity
        run: python3 omega_prime/scripts/ci_receipt.py run pip_identity -- python3 -m pip --version
      - name: install
        id: install
        # .[dev]: /omega-python, which the readiness profile drives, runs ruff
        # from this interpreter. Every shipping install carries it: the Bot
        # launcher and the image install requirements-lock.txt, and the
        # documented manual install is .[dev].
        run: python3 omega_prime/scripts/ci_receipt.py run install -- python3 -m pip install -e '.[dev]'
      - name: resolved distributions
        id: resolved_distributions
        run: python3 omega_prime/scripts/ci_receipt.py run resolved_distributions -- python3 -m pip list --format=json
      - name: pip check
        id: pip_check
        run: python3 omega_prime/scripts/ci_receipt.py run pip_check -- python3 -m pip check
      - name: discord library import
        id: discord_library_import
        run: python3 omega_prime/scripts/ci_receipt.py run discord_library_import -- python3 -c 'import importlib.metadata as m; print(m.version("discord.py")); import discord; print(discord.__file__)'
      - name: discord product import
        id: discord_product_import
        run: python3 omega_prime/scripts/ci_receipt.py run discord_product_import -- python3 -c 'import omega_prime.tools.discord as d; print(d.__file__); print(d.DiscordError.__name__)'
      - name: test suite
        id: suite
        run: python3 omega_prime/scripts/ci_receipt.py run suite -- python3 -m pytest omega_prime/tests -q -rA --junitxml="$RUNNER_TEMP/phase48-suite.xml"
      - name: evals
        id: evals
        run: python3 omega_prime/scripts/ci_receipt.py run evals -- python3 -m omega_prime.evals.runner omega_prime/evals/cases
      - name: readiness
        id: readiness
        run: python3 omega_prime/scripts/ci_receipt.py run readiness -- python3 -m omega_prime.grokbot.readiness --root . --json --output "$RUNNER_TEMP/phase76-readiness.json"
      - name: assemble check
        id: assembly
        run: python3 omega_prime/scripts/ci_receipt.py run assembly -- bash omega_prime/scripts/assemble-prompts.sh --check
      - name: receipt summary
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
          REQUESTED_PYTHON: ${{ matrix.python-version }}
          STAGES: checkout setup_python prime_pin prime_checkout interpreter_identity pip_identity install resolved_distributions pip_check discord_library_import discord_product_import suite evals readiness assembly
          GUARD_TESTCASE: omega_prime/tests/test_deps_matrix.py::test_discord_module_imports_without_the_library
          GUARD_CLASSNAME: omega_prime.tests.test_deps_matrix
          GUARD_NAME: test_discord_module_imports_without_the_library
        run: python3 omega_prime/scripts/ci_receipt.py summary
      - name: retain readiness evidence
        id: readiness_retention
        if: always()
        env:
          READINESS_OBSERVED_EXIT: ${{ steps.readiness.outputs.exit_code }}
          READINESS_INTERPRETER: requested ${{ matrix.python-version }}, setup ${{ steps.setup_python.outputs.python-version }}, path ${{ steps.setup_python.outputs.python-path }}
          READINESS_SOURCE_COMMIT: ${{ github.sha }}
        run: python3 omega_prime/scripts/ci_receipt.py retention --stage readiness --observed-exit "${READINESS_OBSERVED_EXIT:-unobserved}" --interpreter "$READINESS_INTERPRETER" --source-commit "$READINESS_SOURCE_COMMIT" --candidate "$RUNNER_TEMP/phase76-readiness.json" --output "$RUNNER_TEMP/phase76-readiness.retained.json"
      - name: upload readiness evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase76-readiness-${{ github.job }}-${{ matrix.python-version }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/phase76-readiness.retained.json
            ${{ runner.temp }}/phase48-suite.xml
          if-no-files-found: warn
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        id: checkout
      - uses: actions/setup-python@v5
        id: setup_python
        with:
          python-version: ${{ matrix.python-version }}
      - name: interpreter identity
        id: interpreter_identity
        env:
          REQUESTED_PYTHON: ${{ matrix.python-version }}
          SETUP_PYTHON_VERSION: ${{ steps.setup_python.outputs.python-version }}
          SETUP_PYTHON_PATH: ${{ steps.setup_python.outputs.python-path }}
        run: python3 omega_prime/scripts/ci_receipt.py identity
      - name: pip identity
        id: pip_identity
        run: python3 omega_prime/scripts/ci_receipt.py run pip_identity -- python3 -m pip --version
      - name: install
        id: install
        run: python3 omega_prime/scripts/ci_receipt.py run install -- python3 -m pip install -e '.[dev]'
      - name: resolved distributions
        id: resolved_distributions
        run: python3 omega_prime/scripts/ci_receipt.py run resolved_distributions -- python3 -m pip list --format=json
      - name: pip check
        id: pip_check
        run: python3 omega_prime/scripts/ci_receipt.py run pip_check -- python3 -m pip check
      - name: ruff check
        id: ruff
        run: python3 omega_prime/scripts/ci_receipt.py run ruff -- python3 -m ruff check omega_prime/
      - name: ruff format check
        id: ruff_format
        run: python3 omega_prime/scripts/ci_receipt.py run ruff_format -- python3 -m ruff format --check omega_prime/
      - name: receipt summary
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
          REQUESTED_PYTHON: ${{ matrix.python-version }}
          STAGES: checkout setup_python interpreter_identity pip_identity install resolved_distributions pip_check ruff ruff_format
        run: python3 omega_prime/scripts/ci_receipt.py summary
  types:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        id: checkout
      - uses: actions/setup-python@v5
        id: setup_python
        with:
          python-version: ${{ matrix.python-version }}
      - name: interpreter identity
        id: interpreter_identity
        env:
          REQUESTED_PYTHON: ${{ matrix.python-version }}
          SETUP_PYTHON_VERSION: ${{ steps.setup_python.outputs.python-version }}
          SETUP_PYTHON_PATH: ${{ steps.setup_python.outputs.python-path }}
        run: python3 omega_prime/scripts/ci_receipt.py identity
      - name: pip identity
        id: pip_identity
        run: python3 omega_prime/scripts/ci_receipt.py run pip_identity -- python3 -m pip --version
      - name: install
        id: install
        run: python3 omega_prime/scripts/ci_receipt.py run install -- python3 -m pip install -e '.[dev]'
      - name: resolved distributions
        id: resolved_distributions
        run: python3 omega_prime/scripts/ci_receipt.py run resolved_distributions -- python3 -m pip list --format=json
      - name: pip check
        id: pip_check
        run: python3 omega_prime/scripts/ci_receipt.py run pip_check -- python3 -m pip check
      - name: mypy
        id: mypy
        run: python3 omega_prime/scripts/ci_receipt.py run mypy -- python3 -m mypy omega_prime/
      - name: receipt summary
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
          REQUESTED_PYTHON: ${{ matrix.python-version }}
          STAGES: checkout setup_python interpreter_identity pip_identity install resolved_distributions pip_check mypy
        run: python3 omega_prime/scripts/ci_receipt.py summary
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: pip install -e . pytest
      - name: docs link tests
        run: python3 -m pytest omega_prime/tests/test_docs.py omega_prime/tests/test_public_repo.py -q
      - name: tool catalog currency
        run: python3 -m omega_prime.tooling.catalog --check
      - name: plugin manifest currency
        run: python3 -m omega_prime.tooling.plugin --check
      - name: prompt format currency
        run: python3 -m omega_prime.tooling.prompt_format --check
  # Pin-freshness gate: proves the redteam submodule gitlink, the VENDOR.md
  # pin, the provenance docstrings, the vendored pack, and the adapter tool
  # surface all agree with upstream at the pin. Fail-closed: any mismatch
  # fails the job naming the disagreeing pair (see sidecar/provenance.py).
  redteam-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: provenance check
        run: python3 sidecar/provenance.py check
      - name: provenance pack-diff
        run: python3 sidecar/provenance.py pack-diff
      - name: provenance surface
        run: python3 sidecar/provenance.py surface
  # Sandbox-policy drift guard (Phase 83, SAND-01): the committed
  # omega_prime/hosting/openshell/sandbox-policy.yaml is generated output.
  # Regenerate from the canonical seat policy and diff; any hand-edit fails
  # the job with the diff attached. Hermetic: stdlib only, no openshell
  # binary, no network.
  sandbox-policy-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: regenerate sandbox policy
        run: python3 -m omega_prime.sandbox.policy_gen --seat omega_prime/contracts/policies/omega-prime.json --out /tmp/sandbox-policy.regen.yaml
      - name: diff against committed policy
        run: |
          set -o pipefail
          diff -u omega_prime/hosting/openshell/sandbox-policy.yaml /tmp/sandbox-policy.regen.yaml \
            | tee /tmp/sandbox-policy.diff || {
            echo "::error::sandbox-policy.yaml drifted from the generator output (see diff above). Regenerate with: python3 -m omega_prime.sandbox.policy_gen --seat omega_prime/contracts/policies/omega-prime.json --out omega_prime/hosting/openshell/sandbox-policy.yaml"
            exit 1
          }
      - name: attach drift diff
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sandbox-policy-drift-${{ github.sha }}
          path: |
            /tmp/sandbox-policy.regen.yaml
            /tmp/sandbox-policy.diff
          if-no-files-found: warn
