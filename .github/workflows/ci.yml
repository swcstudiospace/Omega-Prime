name: ci

on:
  push:
  pull_request:

# Shared receipt logic lives in omega_prime/scripts/ci_receipt.py (stdlib only).
#
# Runner: every job runs on the omega-ci pool ([self-hosted, linux, x64,
# omega-ci], docs/ci-runners.md), never on GitHub-hosted runners. Interpreters
# and Node come from the runner image's read-only tool cache (setup-python /
# setup-node cache hits); installs land in the job's own HOME.
# Fork pull requests never reach the pool (job-level same-repository guard).

# Least privilege: checkout reads content; artifact upload uses the Actions
# runtime credential, so contents read is enough (no actions write claim).

permissions:
  contents: read

# Queue a newer push instead of cancelling the run already in progress.
# A cancelled run stays on the commit, and the ship gate treats any
# CANCELLED check as a failure even after a later run of that commit passes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, omega-ci]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        id: checkout
      - name: writable tool cache when the image lacks this Python
        run: |
          set -euo pipefail
          ver="${{ matrix.python-version }}"
          if compgen -G "/opt/hostedtoolcache/Python/${ver}."*/x64.complete > /dev/null; then
            echo "image cache has Python ${ver}"
            exit 0
          fi
          # The image's read-only tool cache ships 3.10, 3.12, 3.13 and 3.14
          # (deploy/ci-runner-desktop/Dockerfile). Only a version it lacks is
          # downloaded, into this job's temp dir (setup-python's normal cache
          # miss) instead of failing the mkdir on /opt/hostedtoolcache.
          cache="$RUNNER_TEMP/hostedtoolcache"
          mkdir -p "$cache"
          echo "RUNNER_TOOL_CACHE=$cache" >> "$GITHUB_ENV"
          echo "AGENT_TOOLSDIRECTORY=$cache" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        id: setup_python
        with:
          python-version: ${{ matrix.python-version }}
      - name: writable prefix for pip
        run: |
          set -euo pipefail
          # The tool-cache prefix is shared and read-only by design, so pip
          # would land in ~/.local. Engine and archive tests set HOME or
          # PYTHONNOUSERSITE and then cannot import those packages. A per-job
          # venv keeps the install on the interpreter prefix.
          python3 -m venv "$RUNNER_TEMP/py"
          echo "$RUNNER_TEMP/py/bin" >> "$GITHUB_PATH"
      - name: read Prime pin
        id: prime_pin
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          pin = json.load(open("omega_prime/contracts/prime-agent.pin.json"))
          print(f"commit={pin['commit']}")
          EOF
      - name: checkout Prime test prerequisite
        id: prime_checkout
        uses: actions/checkout@v7
        with:
          repository: PrimeIntellect-ai/prime-agent
          ref: ${{ steps.prime_pin.outputs.commit }}
          path: prime-agent
      - name: interpreter identity
        id: interpreter_identity
        env:
          REQUESTED_PYTHON: ${{ matrix.python-version }}
          SETUP_PYTHON_VERSION: ${{ steps.setup_python.outputs.python-version }}
          SETUP_PYTHON_PATH: ${{ steps.setup_python.outputs.python-path }}
        run: python3 omega_prime/scripts/ci_receipt.py identity
      - name: pip identity
        id: pip_identity
        run: python3 omega_prime/scripts/ci_receipt.py run pip_identity -- python3 -m pip --version
      - name: install
        id: install
        # .[dev]: /omega-python, which the readiness profile drives, runs ruff
        # from this interpreter. Every shipping install carries it: the Bot
        # launcher and the image install requirements-lock.txt, and the
        # documented manual install is .[dev].
        run: python3 omega_prime/scripts/ci_receipt.py run install -- python3 -m pip install -e '.[dev,eventstream]'
      - name: resolved distributions
        id: resolved_distributions
        run: python3 omega_prime/scripts/ci_receipt.py run resolved_distributions -- python3 -m pip list --format=json
      - name: pip check
        id: pip_check
        run: python3 omega_prime/scripts/ci_receipt.py run pip_check -- python3 -m pip check
      - name: discord library import
        id: discord_library_import
        run: python3 omega_prime/scripts/ci_receipt.py run discord_library_import -- python3 -c 'import importlib.metadata as m; print(m.version("discord.py")); import discord; print(discord.__file__)'
      - name: discord product import
        id: discord_product_import
        run: python3 omega_prime/scripts/ci_receipt.py run discord_product_import -- python3 -c 'import omega_prime.tools.discord as d; print(d.__file__); print(d.DiscordError.__name__)'
      - name: test suite
        id: suite
        run: python3 omega_prime/scripts/ci_receipt.py run suite -- python3 -m pytest omega_prime/tests -q -rA --junitxml="$RUNNER_TEMP/phase48-suite.xml"
      - name: evals
        id: evals
        run: python3 omega_prime/scripts/ci_receipt.py run evals -- python3 -m omega_prime.evals.runner omega_prime/evals/cases
      - name: readiness
        id: readiness
        run: python3 omega_prime/scripts/ci_receipt.py run readiness -- python3 -m omega_prime.grokbot.readiness --root . --json --output "$RUNNER_TEMP/phase76-readiness.json"
      - name: assemble check
        id: assembly
        run: python3 omega_prime/scripts/ci_receipt.py run assembly -- bash omega_prime/scripts/assemble-prompts.sh --check
      - name: receipt summary
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
          REQUESTED_PYTHON: ${{ matrix.python-version }}
          STAGES: checkout setup_python prime_pin prime_checkout interpreter_identity pip_identity install resolved_distributions pip_check discord_library_import discord_product_import suite evals readiness assembly
          GUARD_TESTCASE: omega_prime/tests/test_deps_matrix.py::test_discord_module_imports_without_the_library
          GUARD_CLASSNAME: omega_prime.tests.test_deps_matrix
          GUARD_NAME: test_discord_module_imports_without_the_library
        run: python3 omega_prime/scripts/ci_receipt.py summary
      - name: retain readiness evidence
        id: readiness_retention
        if: always()
        env:
          READINESS_OBSERVED_EXIT: ${{ steps.readiness.outputs.exit_code }}
          READINESS_INTERPRETER: requested ${{ matrix.python-version }}, setup ${{ steps.setup_python.outputs.python-version }}, path ${{ steps.setup_python.outputs.python-path }}
          READINESS_SOURCE_COMMIT: ${{ github.sha }}
        run: python3 omega_prime/scripts/ci_receipt.py retention --stage readiness --observed-exit "${READINESS_OBSERVED_EXIT:-unobserved}" --interpreter "$READINESS_INTERPRETER" --source-commit "$READINESS_SOURCE_COMMIT" --candidate "$RUNNER_TEMP/phase76-readiness.json" --output "$RUNNER_TEMP/phase76-readiness.retained.json"
      - name: upload readiness evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase76-readiness-${{ github.job }}-${{ matrix.python-version }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/phase76-readiness.retained.json
            ${{ runner.temp }}/phase48-suite.xml
          if-no-files-found: warn
  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, omega-ci]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        id: checkout
      - name: writable tool cache when the image lacks this Python
        run: |
          set -euo pipefail
          ver="${{ matrix.python-version }}"
          if compgen -G "/opt/hostedtoolcache/Python/${ver}."*/x64.complete > /dev/null; then
            echo "image cache has Python ${ver}"
            exit 0
          fi
          # The image's read-only tool cache ships 3.10, 3.12, 3.13 and 3.14
          # (deploy/ci-runner-desktop/Dockerfile). Only a version it lacks is
          # downloaded, into this job's temp dir (setup-python's normal cache
          # miss) instead of failing the mkdir on /opt/hostedtoolcache.
          cache="$RUNNER_TEMP/hostedtoolcache"
          mkdir -p "$cache"
          echo "RUNNER_TOOL_CACHE=$cache" >> "$GITHUB_ENV"
          echo "AGENT_TOOLSDIRECTORY=$cache" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        id: setup_python
        with:
          python-version: ${{ matrix.python-version }}
      - name: writable prefix for pip
        run: |
          set -euo pipefail
          # The tool-cache prefix is read-only, so pip would land in ~/.local.
          # A venv keeps the install on the interpreter prefix, matching verify.
          python3 -m venv "$RUNNER_TEMP/py"
          echo "$RUNNER_TEMP/py/bin" >> "$GITHUB_PATH"
      - name: interpreter identity
        id: interpreter_identity
        env:
          REQUESTED_PYTHON: ${{ matrix.python-version }}
          SETUP_PYTHON_VERSION: ${{ steps.setup_python.outputs.python-version }}
          SETUP_PYTHON_PATH: ${{ steps.setup_python.outputs.python-path }}
        run: python3 omega_prime/scripts/ci_receipt.py identity
      - name: pip identity
        id: pip_identity
        run: python3 omega_prime/scripts/ci_receipt.py run pip_identity -- python3 -m pip --version
      - name: install
        id: install
        run: python3 omega_prime/scripts/ci_receipt.py run install -- python3 -m pip install -e '.[dev,eventstream]'
      - name: resolved distributions
        id: resolved_distributions
        run: python3 omega_prime/scripts/ci_receipt.py run resolved_distributions -- python3 -m pip list --format=json
      - name: pip check
        id: pip_check
        run: python3 omega_prime/scripts/ci_receipt.py run pip_check -- python3 -m pip check
      - name: ruff check
        id: ruff
        run: python3 omega_prime/scripts/ci_receipt.py run ruff -- python3 -m ruff check omega_prime/
      - name: ruff format check
        id: ruff_format
        run: python3 omega_prime/scripts/ci_receipt.py run ruff_format -- python3 -m ruff format --check omega_prime/
      - name: receipt summary
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
          REQUESTED_PYTHON: ${{ matrix.python-version }}
          STAGES: checkout setup_python interpreter_identity pip_identity install resolved_distributions pip_check ruff ruff_format
        run: python3 omega_prime/scripts/ci_receipt.py summary
  types:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, omega-ci]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        id: checkout
      - name: writable tool cache when the image lacks this Python
        run: |
          set -euo pipefail
          ver="${{ matrix.python-version }}"
          if compgen -G "/opt/hostedtoolcache/Python/${ver}."*/x64.complete > /dev/null; then
            echo "image cache has Python ${ver}"
            exit 0
          fi
          # The image's read-only tool cache ships 3.10, 3.12, 3.13 and 3.14
          # (deploy/ci-runner-desktop/Dockerfile). Only a version it lacks is
          # downloaded, into this job's temp dir (setup-python's normal cache
          # miss) instead of failing the mkdir on /opt/hostedtoolcache.
          cache="$RUNNER_TEMP/hostedtoolcache"
          mkdir -p "$cache"
          echo "RUNNER_TOOL_CACHE=$cache" >> "$GITHUB_ENV"
          echo "AGENT_TOOLSDIRECTORY=$cache" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        id: setup_python
        with:
          python-version: ${{ matrix.python-version }}
      - name: writable prefix for pip
        run: |
          set -euo pipefail
          # The tool-cache prefix is read-only, so pip would land in ~/.local.
          # A venv keeps the install on the interpreter prefix, matching verify.
          python3 -m venv "$RUNNER_TEMP/py"
          echo "$RUNNER_TEMP/py/bin" >> "$GITHUB_PATH"
      - name: interpreter identity
        id: interpreter_identity
        env:
          REQUESTED_PYTHON: ${{ matrix.python-version }}
          SETUP_PYTHON_VERSION: ${{ steps.setup_python.outputs.python-version }}
          SETUP_PYTHON_PATH: ${{ steps.setup_python.outputs.python-path }}
        run: python3 omega_prime/scripts/ci_receipt.py identity
      - name: pip identity
        id: pip_identity
        run: python3 omega_prime/scripts/ci_receipt.py run pip_identity -- python3 -m pip --version
      - name: install
        id: install
        run: python3 omega_prime/scripts/ci_receipt.py run install -- python3 -m pip install -e '.[dev,eventstream]'
      - name: resolved distributions
        id: resolved_distributions
        run: python3 omega_prime/scripts/ci_receipt.py run resolved_distributions -- python3 -m pip list --format=json
      - name: pip check
        id: pip_check
        run: python3 omega_prime/scripts/ci_receipt.py run pip_check -- python3 -m pip check
      - name: mypy
        id: mypy
        run: python3 omega_prime/scripts/ci_receipt.py run mypy -- python3 -m mypy omega_prime/
      - name: receipt summary
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
          REQUESTED_PYTHON: ${{ matrix.python-version }}
          STAGES: checkout setup_python interpreter_identity pip_identity install resolved_distributions pip_check mypy
        run: python3 omega_prime/scripts/ci_receipt.py summary
  docs:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, omega-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: writable prefix for pip
        # The image tool cache is shared and read-only, so pip would fall back
        # to ~/.local, which tests that set HOME or PYTHONNOUSERSITE cannot
        # see. A per-job venv keeps installs on the interpreter prefix.
        run: |
          python3 -m venv "$RUNNER_TEMP/py"
          echo "$RUNNER_TEMP/py/bin" >> "$GITHUB_PATH"
      - name: install
        run: python -m pip install -e . pytest
      - name: docs link tests
        run: python3 -m pytest omega_prime/tests/test_docs.py omega_prime/tests/test_public_repo.py -q
      - name: tool catalog currency
        run: python3 -m omega_prime.tooling.catalog --check
      - name: plugin manifest currency
        run: python3 -m omega_prime.tooling.plugin --check
      - name: prompt format currency
        run: python3 -m omega_prime.tooling.prompt_format --check
      - name: environment inventory currency
        run: python3 -m omega_prime.tooling.env_inventory --root . --out docs/configuration.md --check
  # Pin-freshness gate: proves the redteam submodule gitlink, the VENDOR.md
  # pin, the provenance docstrings, the vendored pack, and the adapter tool
  # surface all agree with upstream at the pin. Fail-closed: any mismatch
  # fails the job naming the disagreeing pair (see sidecar/provenance.py).
  redteam-provenance:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, omega-ci]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: provenance check
        run: python3 sidecar/provenance.py check
      - name: provenance pack-diff
        run: python3 sidecar/provenance.py pack-diff
      - name: provenance surface
        run: python3 sidecar/provenance.py surface
  # Sandbox-policy drift guard (Phase 83, SAND-01): the committed
  # omega_prime/hosting/openshell/sandbox-policy.yaml is generated output.
  # Regenerate from the canonical seat policy and diff; any hand-edit fails
  # the job with the diff attached. Hermetic: stdlib only, no openshell
  # binary, no network.
  sandbox-policy-drift:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, omega-ci]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: regenerate sandbox policy
        run: python3 -m omega_prime.sandbox.policy_gen --seat omega_prime/contracts/policies/omega-prime.json --out "$RUNNER_TEMP/sandbox-policy.regen.yaml"
      - name: diff against committed policy
        run: |
          set -o pipefail
          diff -u omega_prime/hosting/openshell/sandbox-policy.yaml "$RUNNER_TEMP/sandbox-policy.regen.yaml" \
            | tee "$RUNNER_TEMP/sandbox-policy.diff" || {
            echo "::error::sandbox-policy.yaml drifted from the generator output (see diff above). Regenerate with: python3 -m omega_prime.sandbox.policy_gen --seat omega_prime/contracts/policies/omega-prime.json --out omega_prime/hosting/openshell/sandbox-policy.yaml"
            exit 1
          }
      - name: attach drift diff
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sandbox-policy-drift-${{ github.sha }}
          path: |
            ${{ runner.temp }}/sandbox-policy.regen.yaml
            ${{ runner.temp }}/sandbox-policy.diff
          if-no-files-found: warn

  eventstream-ts:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, omega-ci]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/eventstream-ts/package-lock.json
      - name: install
        working-directory: packages/eventstream-ts
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: typecheck
        working-directory: packages/eventstream-ts
        run: npm run typecheck
      # vitest sizes its pool from the visible CPUs (48 on a pool host); the
      # Desktop's pid cgroup (pids.max 1000) is shared by every concurrent job,
      # so cap it at the runner's 2 vCPU budget.
      - name: unit tests
        working-directory: packages/eventstream-ts
        run: npm run test:unit -- --minWorkers=1 --maxWorkers=2
      - name: schema contract
        working-directory: packages/eventstream-ts
        run: npm run test:contract -- --minWorkers=1 --maxWorkers=2
  # Not runnable on the pool yet: `services:` needs a Docker daemon, which
  # the omega-ci runners do not have, and omega_prime/scripts/eventstream_it.py
  # drives that service container through `docker inspect/exec/cp` with fixed
  # host ports 6651/8443. A pool-native harness (rootless podman with per-job
  # ports, or a Pulsar binary in the runner image) is the follow-up; until it
  # lands this job fails at container initialisation rather than being
  # skipped or moved off the pool.
  eventstream-it:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, omega-ci]
    timeout-minutes: 45
    permissions:
      contents: read
    services:
      pulsar:
        image: apachepulsar/pulsar:5.0.0@sha256:7222f3199a0b2418abde9ce0906862598415b19b494ae185db189938cfc43fd3
        options: --entrypoint /bin/bash --interactive --tty --publish 127.0.0.1:6651:6651 --publish 127.0.0.1:8443:8443
    steps:
      - uses: actions/checkout@v7
        id: checkout
      - uses: actions/setup-python@v7
        id: setup_python
        with:
          python-version: "3.13"
      - name: writable prefix for pip
        # The image tool cache is shared and read-only, so pip would fall back
        # to ~/.local, which tests that set HOME or PYTHONNOUSERSITE cannot
        # see. A per-job venv keeps installs on the interpreter prefix.
        run: |
          python3 -m venv "$RUNNER_TEMP/py"
          echo "$RUNNER_TEMP/py/bin" >> "$GITHUB_PATH"
      - name: install eventstream dependencies
        run: python -m pip install -e '.[dev,eventstream]'
      - name: prepare owned secure service
        env:
          EVENTSTREAM_CONTAINER_ID: ${{ job.services.pulsar.id }}
          EVENTSTREAM_OWNERSHIP_FILE: ${{ runner.temp }}/eventstream-it/ownership.json
        run: python omega_prime/scripts/eventstream_it.py prepare --container-id "$EVENTSTREAM_CONTAINER_ID" --mode owned-secure --ownership-file "$EVENTSTREAM_OWNERSHIP_FILE"
      - name: start owned secure service
        env:
          EVENTSTREAM_CONTAINER_ID: ${{ job.services.pulsar.id }}
          EVENTSTREAM_OWNERSHIP_FILE: ${{ runner.temp }}/eventstream-it/ownership.json
        run: python omega_prime/scripts/eventstream_it.py start --container-id "$EVENTSTREAM_CONTAINER_ID" --mode owned-secure --ownership-file "$EVENTSTREAM_OWNERSHIP_FILE"
      - name: wait for owned secure service
        env:
          EVENTSTREAM_CONTAINER_ID: ${{ job.services.pulsar.id }}
          EVENTSTREAM_OWNERSHIP_FILE: ${{ runner.temp }}/eventstream-it/ownership.json
        run: |
          python omega_prime/scripts/eventstream_it.py wait --container-id "$EVENTSTREAM_CONTAINER_ID" --mode owned-secure --ownership-file "$EVENTSTREAM_OWNERSHIP_FILE"
          set -a
          source "$RUNNER_TEMP/eventstream-it/client.env"
          set +a
          printf 'OMEGA_EVENTSTREAM_IT_URL=%s\nOMEGA_EVENTSTREAM_IT_ADMIN_URL=%s\nOMEGA_EVENTSTREAM_IT_OWNERSHIP_FILE=%s\n' "$OMEGA_EVENTSTREAM_IT_URL" "$OMEGA_EVENTSTREAM_IT_ADMIN_URL" "$OMEGA_EVENTSTREAM_IT_OWNERSHIP_FILE" >> "$GITHUB_ENV"
          printf 'OMEGA_EVENTSTREAM_TOKEN_FILE=%s\nOMEGA_EVENTSTREAM_ADMIN_TOKEN_FILE=%s\nOMEGA_EVENTSTREAM_TLS_CA_FILE=%s\nOMEGA_EVENTSTREAM_AUTH_KEY_FILE=%s\nOMEGA_EVENTSTREAM_ENCRYPTION_KEY_FILE=%s\nOMEGA_EVENTSTREAM_ENCRYPTION_PUBLIC_KEY_FILE=%s\nOMEGA_EVENTSTREAM_JWT_PUBLIC_KEY_FILE=%s\nOMEGA_EVENTSTREAM_PRIVATE_KEY_FILE=%s\n' "$OMEGA_EVENTSTREAM_TOKEN_FILE" "$OMEGA_EVENTSTREAM_ADMIN_TOKEN_FILE" "$OMEGA_EVENTSTREAM_TLS_CA_FILE" "$OMEGA_EVENTSTREAM_AUTH_KEY_FILE" "$OMEGA_EVENTSTREAM_ENCRYPTION_KEY_FILE" "$OMEGA_EVENTSTREAM_ENCRYPTION_PUBLIC_KEY_FILE" "$OMEGA_EVENTSTREAM_JWT_PUBLIC_KEY_FILE" "$OMEGA_EVENTSTREAM_PRIVATE_KEY_FILE" >> "$GITHUB_ENV"
      - name: owned secure broker integration matrix
        env:
          OMEGA_EVENTSTREAM_IT_MODE: owned-secure
        run: python -m pytest deploy/pulsar/integration/test_pulsar_integration.py -m eventstream_integration -q
      - name: stop owned secure service and remove credentials
        if: always()
        env:
          EVENTSTREAM_CONTAINER_ID: ${{ job.services.pulsar.id }}
          EVENTSTREAM_OWNERSHIP_FILE: ${{ runner.temp }}/eventstream-it/ownership.json
        run: |
          if [ -f "$EVENTSTREAM_OWNERSHIP_FILE" ]; then
            python omega_prime/scripts/eventstream_it.py stop --container-id "$EVENTSTREAM_CONTAINER_ID" --mode owned-secure --ownership-file "$EVENTSTREAM_OWNERSHIP_FILE"
          fi
