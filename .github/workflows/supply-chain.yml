name: supply-chain

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly, Monday 04:17 UTC

# Python dependency audit. Pinned upstream and the product's native bridge
# license gates run independently in rust-parity.yml.

# Runner: every job runs on the omega-ci pool ([self-hosted, linux, x64,
# omega-ci], docs/ci-runners.md), never on GitHub-hosted runners. Interpreters
# and Node come from the runner image's read-only tool cache (setup-python /
# setup-node cache hits); installs land in the job's own HOME.
# Fork pull requests never reach the pool (job-level same-repository guard).

permissions:
  contents: read

# Queue a newer push instead of cancelling the run already in progress.
# A cancelled run stays on the commit, and the ship gate treats any
# CANCELLED check as a failure even after a later run of that commit passes.
concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pip-audit:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, omega-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: writable prefix for pip
        # The image tool cache is shared and read-only, so pip would fall back
        # to ~/.local, which tests that set HOME or PYTHONNOUSERSITE cannot
        # see. A per-job venv keeps installs on the interpreter prefix.
        run: |
          python3 -m venv "$RUNNER_TEMP/py"
          echo "$RUNNER_TEMP/py/bin" >> "$GITHUB_PATH"
      - name: install
        run: python3 -m pip install -e . pip-audit
      - name: pip-audit
        # Audit the committed lock, not the runner's own pip. PYSEC-2026-4114
        # is a PKCE timing oracle in oauthlib's authorization-server grant
        # (code_challenge_method_*), which this process does not host. See
        # SECURITY.md for the bounded exception rationale.
        run: python3 -m pip_audit --progress-spinner off -r requirements-lock.txt --ignore-vuln PYSEC-2026-4114
  # CI-only supply-chain audit of the redteam sidecar backend's Node
  # dependencies. Nothing Node-related enters the runtime path or the image:
  # this job checks out the redteam submodule path only, installs with
  # --ignore-scripts, and fails on any untriaged high-or-above advisory.
  redteam-node-audit:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, omega-ci]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: init redteam submodule only
        run: git submodule update --init redteam
      # Pinned major matches the mixed-major precedent in grokbot-image.yml
      # (checkout@v4 alongside artifact@v7). Node 22 satisfies the upstream
      # engines contract (redteam/package.json requires >=22.19.0).
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - name: npm ci (no scripts)
        working-directory: redteam
        run: npm ci --ignore-scripts
      - name: npm audit
        working-directory: redteam
        env:
          AUDIT_JSON: ${{ runner.temp }}/redteam-audit.json
        run: |
          npm audit --omit=dev --audit-level=high --json > "$AUDIT_JSON" || audit_exit=$?
          # npm audit exits nonzero when advisories exist; that output is the
          # triage input below. Only bail here when it failed WITHOUT JSON.
          if [ -n "${audit_exit:-}" ] && [ ! -s "$AUDIT_JSON" ]; then
            echo "npm audit failed (exit $audit_exit) without usable JSON"
            exit "$audit_exit"
          fi
          python3 ../scripts/redteam-audit-triage.py
