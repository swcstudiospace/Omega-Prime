name: supply-chain

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly, Monday 04:17 UTC

# Python dependency audit. Pinned upstream and the product's native bridge
# license gates run independently in rust-parity.yml.

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: python3 -m pip install -e . pip-audit
      - name: pip-audit
        # Audit the committed lock, not the runner's own pip. oauthlib stays
        # below 4 because tweepy 4.17 requires oauthlib>=3.2.0,<4.
        # PYSEC-2026-4114 is a PKCE timing oracle in oauthlib's
        # authorization-server grant (code_challenge_method_*), which this
        # process does not host. Drop the ignore when tweepy accepts
        # oauthlib>=4. See SECURITY.md.
        run: python3 -m pip_audit --progress-spinner off -r requirements-lock.txt --ignore-vuln PYSEC-2026-4114
