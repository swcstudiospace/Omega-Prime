name: kb-refresh

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

# Runner: every job runs on the omega-ci pool ([self-hosted, linux, x64,
# omega-ci], docs/ci-runners.md), never on GitHub-hosted runners. Interpreters
# and Node come from the runner image's read-only tool cache (setup-python /
# setup-node cache hits); installs land in the job's own HOME.

permissions:
  contents: read

concurrency:
  group: kb-refresh-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: [self-hosted, linux, x64, omega-ci]
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: install
        run: python -m pip install -e .
      - name: check for API key
        id: gate
        env:
          KEY_SET: ${{ secrets.GREPTILE_API_KEY != '' }}
        run: echo "has_key=$KEY_SET" >> "$GITHUB_OUTPUT"
      - name: report missing key skip
        id: skip-notice
        if: steps.gate.outputs.has_key != 'true'
        run: |
          echo "status=skipped" >> "$GITHUB_OUTPUT"
          echo "kb-refresh: skipped — GREPTILE_API_KEY is not configured (not-run; not a completed refresh)"
      - name: sync knowledge base
        if: steps.gate.outputs.has_key == 'true'
        env:
          GREPTILE_API_KEY: ${{ secrets.GREPTILE_API_KEY }}
        run: python3 -m omega_prime.greptile.kb_sync --repo swcstudiospace/omes-bot --out kb
      - name: open update PR
        if: steps.gate.outputs.has_key == 'true' && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git status --porcelain kb/ | grep -q .; then
            branch="kb-refresh-$(date +%Y%m%d)"
            git config user.name "omega-prime-kb-sync"
            git config user.email "omega-prime-kb-sync@users.noreply.github.com"
            git checkout -b "$branch"
            git add kb/
            git commit -m "KB refresh: mirror Greptile knowledge base."
            git push -u origin "$branch"
            gh pr create --title "KB refresh $(date +%Y-%m-%d)" \
              --body "Automated Greptile knowledge-base mirror update. Review synthesized content before merging." \
              --base "${{ github.event.repository.default_branch }}"
          else
            echo "kb-refresh: no changes"
          fi
