name: rust-parity

# Pinned upstream parity and the product's optional native bridge.
# prime-agent/ is ignored locally; both jobs check out the contract pin.
# Keep the bridge job independent of the retained upstream test baseline.
#
# Both jobs run on the omega-ci pool (docs/ci-runners.md), never on
# GitHub-hosted runners. The runner image ships the pin's toolchain (1.98.1,
# beside the 1.99.1 default) in a read-only RUSTUP_HOME and a pinned
# cargo-deny binary, so the toolchain is selected with RUSTUP_TOOLCHAIN (no
# rustup install) and the license gates run cargo-deny directly instead of
# the Docker-based cargo-deny-action. Fork pull requests never reach the pool.

on:
  push:
    paths:
      - omega_prime/contracts/prime-agent.pin.json
      - VENDOR.md
      - native/omega-prime-prime/**
      - deny.toml
      - .github/workflows/rust-parity.yml
  pull_request:
    paths:
      - omega_prime/contracts/prime-agent.pin.json
      - VENDOR.md
      - native/omega-prime-prime/**
      - deny.toml
      - .github/workflows/rust-parity.yml
  schedule:
    # Weekly: surface upstream-adjacent bit-rot even when this repo is quiet.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Each pool runner is budgeted 2 vCPU but sees every host CPU, and the process
# limit is shared across concurrent jobs: cap cargo's parallel rustc jobs.
env:
  CARGO_BUILD_JOBS: "2"
  # Tokio's multi-thread runtime sizes itself from the visible CPU count
  # (48 on a pool host). The pid cgroup is shared, and the extra workers
  # fail with EAGAIN ("OS can't spawn worker thread"). Two matches the
  # runner's 2 vCPU budget.
  TOKIO_WORKER_THREADS: "2"
  RAYON_NUM_THREADS: "2"

concurrency:
  group: rust-parity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, omega-ci]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: read pin
        id: pin
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          pin = json.load(open("omega_prime/contracts/prime-agent.pin.json"))
          print(f"remote={pin['remote']}")
          print(f"commit={pin['commit']}")
          print(f"toolchain={pin['toolchain']}")
          skips = " ".join(f"--skip {t}" for t in pin["known_failing_tests"])
          print(f"skips={skips}")
          EOF

      - name: checkout prime-agent at the pinned commit
        uses: actions/checkout@v7
        with:
          repository: PrimeIntellect-ai/prime-agent
          ref: ${{ steps.pin.outputs.commit }}
          path: prime-agent

      - name: rust toolchain (runner image)
        env:
          PIN_TOOLCHAIN: ${{ steps.pin.outputs.toolchain }}
        run: |
          set -euo pipefail
          # The rustup proxies under /opt/rust/cargo/bin write a temp file in the
          # read-only RUSTUP_HOME, and they try a channel sync when the pin is
          # absent. Call the image's real toolchain binaries instead.
          bin="/opt/rust/rustup/toolchains/${PIN_TOOLCHAIN}-x86_64-unknown-linux-gnu/bin"
          if [ ! -x "$bin/rustc" ] || [ ! -x "$bin/cargo" ]; then
            echo "::error::Rust $PIN_TOOLCHAIN (the contract pin) is not in the omega-ci runner image; add it there (deploy/ci-runner-desktop/Dockerfile RUST_PARITY_VERSION)"
            exit 1
          fi
          echo "$bin" >> "$GITHUB_PATH"
          export PATH="$bin:$PATH"
          "$bin/rustc" --version
          "$bin/cargo" --version
          cargo deny --version

      - name: cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: prime-agent
          key: ${{ steps.pin.outputs.commit }}

      - name: build (locked)
        working-directory: prime-agent
        run: cargo build --locked

      - name: license gate
        run: cargo deny --manifest-path prime-agent/Cargo.toml --locked --config prime-agent/deny.toml check licenses

      # pa-daemon's kernel suites (for example
      # goal_turn_end_loop_runs_to_completion) run the ipython tool against the
      # ambient kernel venv and fail without it. Upstream's own CI
      # (prime-agent .github/workflows/ci.yml, test-shard job) installs uv and
      # bootstraps that venv before its tests; these two steps mirror it.
      # ~/.local/bin gains uv only, never a prime-agent binary (see the PATH
      # note on the test step).
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: install uv (the kernel venv bootstrap uses it)
        run: |
          # The image's /usr/bin/python3 is externally managed and rejects
          # pip install --user. setup-python selects the cached interpreter,
          # whose pip installs into this job's HOME.
          # Pinned: the version this job last ran green with. Bump deliberately.
          python3 -m pip install --user uv==0.13.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: bootstrap the kernel venv
        working-directory: prime-agent
        run: ./target/debug/prime-agent --prime-agent-bootstrap

      # The --skip set is the Phase 53 baseline's documented exclusions:
      # three pa-cli acp_mode_e2e tests whose ACP-stdio settle assertions are
      # timing-sensitive on shared runners (reproduced locally under full
      # parallelism; pa-cli is out of v10 port scope). Each exclusion carries
      # its reason here per the prime-agent AGENTS.md disabled-test rule.
      # Do not install a prime-agent binary on this job's PATH. pa-cli
      # differential tests treat `which prime-agent` as a TypeScript oracle
      # and skip when it is absent. The published 0.9.8 CLI is not that
      # oracle: it fails differential_corpus_matches_ts_binary on the
      # package-update hint (`update --force` versus `update`).
      - name: test workspace (locked)
        working-directory: prime-agent
        # GITHUB_TOKEN is not passed in. pa-daemon model tests treat
        # GH_TOKEN / GITHUB_TOKEN / OPENROUTER_API_KEY as configured
        # providers and then fail closed. Unset them so a runner image
        # or an earlier step cannot leak credentials into the oracle.
        run: |
          unset GH_TOKEN GITHUB_TOKEN OPENROUTER_API_KEY COPILOT_GITHUB_TOKEN
          cargo test --workspace --locked -- ${{ steps.pin.outputs.skips }}


  native:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, omega-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: read pin
        id: pin
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          pin = json.load(open("omega_prime/contracts/prime-agent.pin.json"))
          print(f"commit={pin['commit']}")
          print(f"toolchain={pin['toolchain']}")
          EOF

      - name: checkout prime-agent at the pinned commit
        uses: actions/checkout@v7
        with:
          repository: PrimeIntellect-ai/prime-agent
          ref: ${{ steps.pin.outputs.commit }}
          path: prime-agent

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: rust toolchain (runner image)
        env:
          PIN_TOOLCHAIN: ${{ steps.pin.outputs.toolchain }}
        run: |
          set -euo pipefail
          # The rustup proxies under /opt/rust/cargo/bin write a temp file in the
          # read-only RUSTUP_HOME, and they try a channel sync when the pin is
          # absent. Call the image's real toolchain binaries instead.
          bin="/opt/rust/rustup/toolchains/${PIN_TOOLCHAIN}-x86_64-unknown-linux-gnu/bin"
          if [ ! -x "$bin/rustc" ] || [ ! -x "$bin/cargo" ]; then
            echo "::error::Rust $PIN_TOOLCHAIN (the contract pin) is not in the omega-ci runner image; add it there (deploy/ci-runner-desktop/Dockerfile RUST_PARITY_VERSION)"
            exit 1
          fi
          echo "$bin" >> "$GITHUB_PATH"
          export PATH="$bin:$PATH"
          "$bin/rustc" --version
          "$bin/cargo" --version
          cargo deny --version

      - name: cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/omega-prime-prime -> ../../prime-agent/target
          key: ${{ steps.pin.outputs.commit }}

      - name: build native bridge (locked)
        run: cargo build --locked --manifest-path native/omega-prime-prime/Cargo.toml --target-dir prime-agent/target

      - name: native bridge license gate
        run: cargo deny --manifest-path native/omega-prime-prime/Cargo.toml --locked --config deny.toml check licenses
