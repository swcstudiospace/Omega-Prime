# Apache Pulsar 5.0.0 standalone overrides for Omega Prime.
# TLS endpoints use operator-managed mounted files; no credential values belong here.

# Never bind phase 106's reserved plaintext port 6650. Port 0 selects an
# unadvertised ephemeral internal listener; applications use the TLS listeners.
brokerServicePort=0
webServicePort=0
brokerServicePortTls=6651
webServicePortTls=8443

allowAutoTopicCreation=false
brokerDeleteInactiveTopicsEnabled=false
brokerDeduplicationEnabled=true
delayedDeliveryEnabled=true
delayedDeliveryTrackerFactoryClassName=org.apache.pulsar.broker.delayed.BucketDelayedDeliveryTrackerFactory
# Embedded BookKeeper durability source; mirror in bookkeeper.conf.
journalSyncData=true
managedLedgerDefaultEnsembleSize=1
managedLedgerDefaultWriteQuorum=1
managedLedgerDefaultAckQuorum=1

backlogQuotaDefaultLimitGB=10
backlogQuotaDefaultLimitSecond=-1
backlogQuotaDefaultRetentionPolicy=producer_request_hold

authenticationEnabled=true
authenticationProviders=org.apache.pulsar.broker.authentication.AuthenticationProviderToken
authorizationEnabled=true
functionsWorkerEnabled=true
authorizationProvider=org.apache.pulsar.broker.authorization.PulsarAuthorizationProvider
superUserRoles=omega-admin,omega-broker-internal
tokenPublicKey=file:///run/secrets/omega-pulsar/token-public.der
tokenPublicAlg=RS256

brokerClientAuthenticationPlugin=org.apache.pulsar.client.impl.auth.AuthenticationToken
brokerClientAuthenticationParameters=token:file:///run/secrets/omega-pulsar/broker-internal.token

tlsCertificateFilePath=/run/secrets/omega-pulsar/tls.crt
tlsKeyFilePath=/run/secrets/omega-pulsar/tls.key
tlsTrustCertsFilePath=/run/secrets/omega-pulsar/ca.crt
tlsAllowInsecureConnection=false
