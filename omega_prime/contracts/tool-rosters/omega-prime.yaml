# Tools the Omega Prime agent may be offered.
# Coding names from register_coding_tools, then growth names from register_growth_tools,
# then delegate_task from register_delegate_tools, then omega_command from
# register_omega_command_tools, then platform names from
# register_platform_tools, then IDE names from register_ide_tools,
# then X names from register_x_tools, then Telegram names from
# register_telegram_tools, then Discord names from register_discord_tools,
# then Lead names from register_lead_tools, then Systems names from
# register_systems_tools, then Web names from register_web_tools, then
# Mobile names from register_mobile_tools, then Infra names from
# register_infra_tools, then Quality names from register_quality_tools,
# then App names from register_packs_tools, then Ultrathink
# names from register_ultrathink_tools, then Substrate names from
# register_substrate_tools, then RLM names from register_rlm_tools
# (gated: prime.rlm.enabled, default off — registered only when enabled),
# then Harness names from register_harness_tools
# (gated: prime.harness.enabled, default off — registered only when enabled),
# then Goals names from register_goal_tools, then Heartbeat names from
# register_heartbeat_tools, then Autonomous names from
# register_autonomous_tools, then Messaging names from
# register_messaging_tools, then Kernel names from
# register_prime_kernel_tools (each gated: prime.<family>.enabled, default
# off — registered only when enabled), then Red Team names from
# register_redteam_tools (gated: the top-level redteam.enabled key, default
# off — registered only when enabled). The kernel family loads the pinned
# Prime rlm package and the nine pa-* crates in-process.
# This list is exactly those names, in that order.
# Absorbed desk contracts (Phase 32): tool-rosters lead/systems/web/
# android/ios/infra/quality/_core.yaml and tool-packs clippyos/desklanes/
# kanbanos.yaml, each desk version 1.0.0, now served to bot-00-omega-prime.
