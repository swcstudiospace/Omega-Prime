# OpenShell 0.1.4 sandbox policy for omp + GSD-Core (schema: docs/how-it-works/policies/schema.mdx).
# Status: written against the documented schema; NOT exercised live (the MicroVM driver cannot boot on
# this host). The host auth-broker must be reachable from the guest at host.openshell.internal (the
# loopback broker on 127.0.0.1 is not visible inside a VM) — confirm the alias before enabling.
version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /etc, /opt]
  read_write: [/sandbox, /tmp]
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  model_providers:
    endpoints:
      - { host: chatgpt.com, port: 443 }
      - { host: auth.openai.com, port: 443 }
      - { host: api.z.ai, port: 443 }
    binaries:
      - path: /sandbox/opt/bun/bin/bun
  package_registries:
    endpoints:
      - { host: registry.npmjs.org, port: 443 }
      - { host: nodejs.org, port: 443 }
      - { host: github.com, port: 443 }
      - { host: objects.githubusercontent.com, port: 443 }
    binaries:
      - path: /sandbox/opt/node/bin/node
      - path: /usr/bin/curl
  host_auth_broker:
    endpoints:
      - { host: host.openshell.internal, port: 18990 }
    binaries:
      - path: /sandbox/opt/bun/bin/bun
