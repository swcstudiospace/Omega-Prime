# OpenShell 0.1.4 sandbox policy for omp + GSD-Core on the rootless Podman driver
# (image localhost/omp-sandbox:0.1, see sandbox/image/Containerfile). Default-deny egress.
# The host omp auth-broker is NOT a network endpoint here: OpenShell never authorizes loopback
# destinations, so the core relays it over the authenticated `openshell sandbox exec` channel into a
# sandbox-local 127.0.0.1 listener (src/core/providers/broker-relay.mjs).
version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /lib64, /bin, /etc, /opt]
  read_write: [/sandbox, /tmp]
landlock:
  compatibility: best_effort
process:
  run_as_user: "1000"
  run_as_group: "1000"
network_policies:
  model_providers:
    endpoints:
      - { host: chatgpt.com, port: 443, tls: skip }
      - { host: auth.openai.com, port: 443, tls: skip }
      - { host: api.z.ai, port: 443, tls: skip }
      - { host: openrouter.ai, port: 443, tls: skip }
    binaries:
      - path: /opt/bunpkg/lib/node_modules/bun/bin/bun.exe
  # Package admission (GSD plans) reads official npm metadata before the first install; omp's own
  # fetch tool runs under Bun and agents also reach for curl/python3, so the read hosts must cover those
  # binaries, not just node (run 20261021-083250: W3 blocked with 'official registry access failed').
  package_registries:
    endpoints:
      - { host: registry.npmjs.org, port: 443, tls: skip }
      - { host: www.npmjs.com, port: 443, tls: skip }
    binaries:
      - path: /opt/node/bin/node
      - path: /opt/bunpkg/lib/node_modules/bun/bin/bun.exe
      - path: /usr/bin/curl
      - path: /usr/bin/python3
