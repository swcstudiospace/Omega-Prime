[project]
name = "omega-prime"
version = "0.1.0"
description = "One Grok programming bot. Hermes, oh-my-pi, and Prime agent logic in one Python process."
readme = "README.md"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Spectrum Web Co" }]
requires-python = ">=3.11"
keywords = ["grok", "agent", "programming-bot", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "mcp>=2.3,<3",
  "pyrit>=1.1",
  "apscheduler>=3.11",
  "aiogram>=3.31",
  "discord.py>=2.7",
  "playwright>=1.64.0",
  "Appium-Python-Client>=6.0",
  "PyYAML>=6.0.3",
]

[project.optional-dependencies]
otel = [
  "opentelemetry-proto",
  "opentelemetry-exporter-otlp-proto-http",
]
eventstream = [
  # Review dependency provenance, licenses, and the SBOM in security gates.
  "pulsar-client==3.13.0",
  "pydantic>=2.13,<3",
  "httpx>=0.28,<1",
]
ci-runners = [
  "uvicorn>=0.30",
]
dev = [
  "ruff==0.17.1",
  "mypy==2.4.0",
  "pytest>=8.0",
  "pydantic>=2.13,<3",
  "hypothesis",
  "jsonschema",
  "pytest-asyncio",
  "pytest-cov",
]

[project.scripts]
omega = "omega_prime.engine.cli:main"

[project.urls]
Homepage = "https://github.com/swcstudiospace/omes-bot"
Repository = "https://github.com/swcstudiospace/omes-bot"
Documentation = "https://github.com/swcstudiospace/omes-bot/tree/main/docs"
Issues = "https://github.com/swcstudiospace/omes-bot/issues"
Changelog = "https://github.com/swcstudiospace/omes-bot/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["omega_prime*"]

[tool.setuptools.package-data]
omega_prime = [
  "**/*.md",
  "**/*.yaml",
  "**/*.yml",
  "**/*.json",
  "**/*.xml",
  "**/*.sh",
  "dashboard/static/*",
  "dashboard/static/cc/index.html",
  "dashboard/static/cc/assets/*",
  "dashboard/static/cc/licenses/*",
]

[tool.pytest.ini_options]
testpaths = ["omega_prime/tests"]
pythonpath = ["."]
# A test stuck this long dumps every thread's stack (it is not failed or
# killed), so a CI hang shows where it stopped instead of only a job timeout.
faulthandler_timeout = 600
markers = [
  "native: requires the optional locally built omega_prime_prime extension",
  "eventstream_integration: requires OMEGA_EVENTSTREAM_IT_URL and the pinned broker service",
]
[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF", "C4", "PIE", "RSE", "LOG", "G", "PGH"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["omega_prime"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
show_error_codes = true
[[tool.mypy.overrides]]
# Strict packages (docs/code-quality.md). Ratchet: only ever add to this list.
module = [
    "omega_prime.eventstream.*",
    "omega_prime.audit.*",
    "omega_prime.ci_runners.*",
    "omega_prime.commands.*",
    "omega_prime.contracts.*",
    "omega_prime.credentials.*",
    "omega_prime.hosting.*",
    "omega_prime.integrations.*",
    "omega_prime.quotas.*",
    "omega_prime.redteam.*",
    "omega_prime.sandbox.*",
    "omega_prime.skills.*",
    "omega_prime.skills_runtime.*",
    "omega_prime.telemetry.*",
    "omega_prime.tooling.*",
]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_return_any = true
warn_unused_ignores = true
strict_equality = true
extra_checks = true
ignore_missing_imports = false

[tool.pyright]
# Resolve third-party imports from the repo-local virtualenv created by the bootstrap (.venv/, gitignored).
venvPath = "."
venv = ".venv"
