# Product bridge license gate. Pinned upstream sources retain their MIT notices.
# This allowlist matches prime-agent/deny.toml plus the AGPL product crate.
[graph]
all-features = true

[licenses]
version = 2
allow = [
  "AGPL-3.0-only",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "ISC",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "Zlib",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  # notify (pa-tui file index watcher, since the 72f790b pin): CC0 public
  # domain dedication. Mirrors prime-agent/deny.toml (upstream 6aaa3fa06).
  "CC0-1.0",
]
