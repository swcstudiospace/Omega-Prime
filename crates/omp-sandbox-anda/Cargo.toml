[package]
name = "omp-sandbox-anda"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "Anda Engine access layer for the omp-sandbox TypeScript core: signed (ICP envelope, Ed25519) tool calls into the sandbox"

[dependencies]
anda_core = "=0.17.1"
anda_engine = "=0.17.4"
anda_engine_server = "=0.17.0"
anda_web3_client = { version = "=0.17.0", features = ["client"] }
axum = "0.8"
candid = "0.10"
http = "1.5"
ic_cose_types = "0.11"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["full"] }
tokio-util = "0.7"
rand = "0.9"

[features]
default = []
# Seam only. Real attestation needs IC-TEE (AWS Nitro Enclave) or a confidential VM; locally every
# response and receipt says attestation="mock".
tee = []
